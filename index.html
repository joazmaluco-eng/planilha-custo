<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançar Despesa</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f5f5f5; }
    h2 { text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { width: 100%; padding: 14px; margin-top: 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <h2>Nova Despesa</h2>
  <form id="despesaForm">
    <label>Descrição:</label>
    <input type="text" name="Descrição" required>

    <label>Valor:</label>
    <input type="number" step="0.01" name="Valor" required>

    <label>Categoria:</label>
    <select name="Categoria">
      <option>Alimentação</option>
      <option>Transporte</option>
      <option>Moradia</option>
      <option>Lazer</option>
      <option>Saúde</option>
      <option>Outros</option>
    </select>

    <button type="submit">Salvar</button>
  </form>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    const form = document.getElementById('despesaForm');
    const scriptURL = 'https://script.google.com/macros/s/AKfycbze8WsbW-inPjxJR3YkGda8nyMs4gtovSwVx8XR3gZMSxIUFM_gJ6dq-6Z_dKBgeqig/exec';

    form.addEventListener('submit', e => {
      e.preventDefault();
      form.target = 'hidden_iframe';
      form.method = 'POST';
      form.action = scriptURL;
      form.submit();
      alert('Despesa enviada! Confira a planilha.');
      setTimeout(() => { form.reset(); form.target = ''; }, 1000);
    });
  </script>
</body>
</html>
