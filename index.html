<script>
  const form = document.getElementById('despesaForm');
  // COLE AQUI A URL DO SEU APPS SCRIPT
  const scriptURL = 'https://script.google.com/macros/s/AKfycbze8WsbW-inPjxJR3YkGda8nyMs4gtovSwVx8XR3gZMSxIUFM_gJ6dq-6Z_dKBgeqig/exec';

  form.addEventListener('submit', e => {
    e.preventDefault(); // Impede o envio padrão

    // Cria um iframe invisível para receber a resposta
    const iframe = document.createElement('iframe');
    iframe.name = 'hidden_iframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    // Aponta o formulário para o iframe
    form.target = 'hidden_iframe';
    form.method = 'POST';
    form.action = scriptURL;

    // Envia o formulário (sem CORS, pois é um submit normal)
    form.submit();

    // Feedback para o usuário
    alert('Despesa enviada! Aguarde alguns segundos e confira a planilha.');
    form.reset();

    // Remove o iframe depois de um tempo
    setTimeout(() => document.body.removeChild(iframe), 5000);
  });
</script>
